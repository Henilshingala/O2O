# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Build architectures
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Android Release Signing Configuration
# Generate a keystore using: keytool -genkey -v -keystore o2o-release.keystore -alias o2o-key-alias -keyalg RSA -keysize 2048 -validity 10000
# Then set these properties to your keystore values:
# MYAPP_RELEASE_STORE_FILE=o2o-release.keystore
# MYAPP_RELEASE_STORE_PASSWORD=your_store_password
# MYAPP_RELEASE_KEY_ALIAS=o2o-key-alias
# MYAPP_RELEASE_KEY_PASSWORD=your_key_password

# New Architecture (disabled — react-native-reanimated v3 does not require it)
newArchEnabled=false

# Hermes JS engine (must be enabled for production standalone builds)
hermesEnabled=true

# Edge-to-edge display support
edgeToEdgeEnabled=true

# Java toolchain
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64