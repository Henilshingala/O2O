apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.gms.google-services"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

apply from: new File(["node", "--print", "require.resolve('react-native/react.gradle')"].execute(null, rootDir).text.trim())

project.ext.react = [
    enableHermes: true,
    bundleInRelease: false,
]

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            buildStagingDirectory "${rootProject.buildDir}/../.cxx"
        }
    }

    namespace 'com.o2o.app'
    defaultConfig {
        applicationId 'com.o2o.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Release signing config - keystore properties from gradle.properties or environment
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(project.property('MYAPP_RELEASE_STORE_FILE'))
                storePassword project.property('MYAPP_RELEASE_STORE_PASSWORD')
                keyAlias project.property('MYAPP_RELEASE_KEY_ALIAS')
                keyPassword project.property('MYAPP_RELEASE_KEY_PASSWORD')
            } else {
                // Fallback to debug keystore if release config not provided (for development)
                // WARNING: For production, set MYAPP_RELEASE_* properties in gradle.properties
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableMinifyInReleaseBuilds
            if (enableMinifyInReleaseBuilds) {
                shrinkResources true
            }
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        pickFirst '**/libjsi.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libreact_nativemodule_core.so'
        pickFirst '**/libfbjni.so'
        jniLibs {
            useLegacyPackaging true
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    for (i in 0..<options.size()) options[i] = options[i].trim();
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.facebook.react:react-native:0.68.7"

    if (hermesEnabled.toBoolean()) {
        def hermesPath = new File(["node", "--print", "require('path').dirname(require.resolve('hermes-engine/package.json'))"].execute(null, rootDir).text.trim(), "android")
        debugImplementation files(new File(hermesPath, "hermes-debug.aar"))
        releaseImplementation files(new File(hermesPath, "hermes-release.aar"))
    } else {
        implementation jscFlavor
    }
}
// Copy vector icon fonts into assets.
// Uses a direct Gradle copy task instead of fonts.gradle because fonts.gradle
// relies on `node` being in PATH during the Gradle build, which is unreliable
// on Windows and in pnpm monorepos. The copy task below finds fonts from either
// the project node_modules or the workspace-root node_modules (pnpm hoists there).
android.applicationVariants.all { variant ->
    def mergeAssets = variant.mergeAssetsProvider.get()
    mergeAssets.doFirst {
        def fontsDir = new File(mergeAssets.outputDir.get().asFile, "fonts")
        fontsDir.mkdirs()
        // projectRoot = artifacts/o2o  (set at top of this file)
        // workspace root is two levels up: artifacts/o2o -> artifacts -> repo root
        def candidates = [
            new File("${projectRoot}/node_modules/react-native-vector-icons/Fonts"),
            new File("${projectRoot}/../../node_modules/react-native-vector-icons/Fonts"),
        ]
        def fontsSource = candidates.find { it.exists() }
        if (fontsSource) {
            copy {
                from fontsSource
                into fontsDir
                include "*.ttf"
            }
            println "react-native-vector-icons: copied fonts from ${fontsSource}"
        } else {
            // Fonts already committed to assets/fonts — no copy needed
            println "react-native-vector-icons: fonts.gradle source not found; using committed fonts in assets/fonts/"
        }
    }
}

apply from: new File(["node", "--print", "require('path').dirname(require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })) + '/native_modules.gradle'"].execute(null, rootDir).text.trim()); applyNativeModulesAppBuildGradle(project)

project.afterEvaluate {
    project.tasks.configureEach { task ->
        if (task.name.startsWith("bundle") && task.name.endsWith("JsAndAssets") || task.name.contains("copyReleaseBundledJs")) {
            task.enabled = false
            task.doNotTrackState("We bundle manually because pnpm symlinks break Gradle file tree inputs")
        }
    }
}

